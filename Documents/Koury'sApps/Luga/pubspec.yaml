name: luga
description: Peer-to-peer package delivery marketplace — UAE/KSA → Egypt.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.1.0

  # Backend
  supabase_flutter: ^2.8.4

  # Payments — Stripe for everything (Apple Pay / Google Pay primary)
  flutter_stripe: ^12.4.0

  # Push notifications
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3

  # KYC
  webview_flutter: ^4.10.0

  # Responsive sizing — base 390×844
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  image_picker: ^1.1.2

  # Storage
  flutter_secure_storage: ^10.0.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5

  # Analytics
  mixpanel_flutter: ^2.3.5

  # Crash reporting
  sentry_flutter: ^9.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: IBMPlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
